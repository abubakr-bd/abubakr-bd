<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, 15px) scale(1.15); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-25px, -20px) scale(1.2); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.95; }
      }
      @keyframes waveBar {
        0%, 100% { height: 12px; y: 208px; }
        50% { height: 38px; y: 182px; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes tagShine {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }

      .glow-orb-1 { animation: float1 7s ease-in-out infinite; transform-origin: 150px 70px; }
      .glow-orb-2 { animation: float2 9s ease-in-out infinite; transform-origin: 700px 170px; }
      .pulse-text { animation: pulseGlow 4s ease-in-out infinite; }
      .pulse-dot { animation: blinkDot 2s ease-in-out infinite; transform-origin: 792px 36px; }

      .bar1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
      .bar2 { animation: waveBar 1.4s ease-in-out infinite 0.3s; }
      .bar3 { animation: waveBar 1.1s ease-in-out infinite 0.5s; }
      .bar4 { animation: waveBar 1.5s ease-in-out infinite 0.2s; }
      .bar5 { animation: waveBar 1.3s ease-in-out infinite 0.7s; }
      .bar6 { animation: waveBar 1.6s ease-in-out infinite 0.4s; }
      .bar7 { animation: waveBar 1.2s ease-in-out infinite 0.6s; }
      .bar8 { animation: waveBar 1.4s ease-in-out infinite 0.15s; }
      .bar9 { animation: waveBar 1.5s ease-in-out infinite 0.45s; }
      .bar10 { animation: waveBar 1.3s ease-in-out infinite 0.25s; }
      .bar11 { animation: waveBar 1.6s ease-in-out infinite 0.65s; }
      .bar12 { animation: waveBar 1.2s ease-in-out infinite 0.35s; }

      .tag-box { animation: tagShine 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Animated Background Orbs -->
  <circle class="glow-orb-1" cx="160" cy="80" r="130" fill="url(#glowGrad1)"/>
  <circle class="glow-orb-2" cx="720" cy="160" r="140" fill="url(#glowGrad2)"/>

  <!-- Modern Subtle Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40"/>
    <line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/>
    <line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="170" y1="0" x2="170" y2="240"/>
    <line x1="340" y1="0" x2="340" y2="240"/>
    <line x1="510" y1="0" x2="510" y2="240"/>
    <line x1="680" y1="0" x2="680" y2="240"/>
  </g>

  <!-- Glowing Border Outline -->
  <rect width="848" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(620, 24)">
    <rect width="195" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#22c55e" class="pulse-dot"/>
    <text x="28" y="18" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Available for Projects</text>
  </g>

  <!-- Creative Badge (Top Left) -->
  <g transform="translate(36, 26)">
    <rect width="168" height="24" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="10" y="16" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">✦ CREATIVE MOTION</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(36, 95)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Abu Bakr Siddiq
    </text>
  </g>

  <!-- Subtitle with Motion Focus -->
  <g transform="translate(38, 126)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.8">
      MOTION DESIGNER  •  VIDEO EDITOR  •  VIBE CODER
    </text>
  </g>

  <!-- Pill Tags for Tools -->
  <!-- Tag 1: After Effects -->
  <g transform="translate(36, 150)">
    <rect class="tag-box" width="112" height="26" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1"/>
    <text x="12" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎬 After Effects</text>
  </g>

  <!-- Tag 2: Premiere Pro -->
  <g transform="translate(158, 150)">
    <rect class="tag-box" width="118" height="26" rx="6" fill="#3b0764" fill-opacity="0.6" stroke="#c084fc" stroke-width="1"/>
    <text x="12" y="17" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✂️ Premiere Pro</text>
  </g>

  <!-- Tag 3: DaVinci Resolve -->
  <g transform="translate(286, 150)">
    <rect class="tag-box" width="128" height="26" rx="6" fill="#18181b" fill-opacity="0.7" stroke="#fb7185" stroke-width="1"/>
    <text x="12" y="17" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎞️ DaVinci Resolve</text>
  </g>

  <!-- Tag 4: Figma -->
  <g transform="translate(424, 150)">
    <rect class="tag-box" width="80" height="26" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="17" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎨 Figma</text>
  </g>

  <!-- Tag 5: Vibe Coding & AI -->
  <g transform="translate(514, 150)">
    <rect class="tag-box" width="154" height="26" rx="6" fill="#140f28" fill-opacity="0.7" stroke="#f472b6" stroke-width="1"/>
    <text x="12" y="17" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Vibe Coding &amp; AI</text>
  </g>

  <!-- Animated Equalizer / Video Timeline Waveform (Bottom Right) -->
  <g transform="translate(685, 0)">
    <rect class="bar1" x="0" width="4" rx="2" fill="#38bdf8" fill-opacity="0.85"/>
    <rect class="bar2" x="9" width="4" rx="2" fill="#60a5fa" fill-opacity="0.85"/>
    <rect class="bar3" x="18" width="4" rx="2" fill="#818cf8" fill-opacity="0.85"/>
    <rect class="bar4" x="27" width="4" rx="2" fill="#a78bfa" fill-opacity="0.85"/>
    <rect class="bar5" x="36" width="4" rx="2" fill="#c084fc" fill-opacity="0.85"/>
    <rect class="bar6" x="45" width="4" rx="2" fill="#e879f9" fill-opacity="0.85"/>
    <rect class="bar7" x="54" width="4" rx="2" fill="#f472b6" fill-opacity="0.85"/>
    <rect class="bar8" x="63" width="4" rx="2" fill="#fb7185" fill-opacity="0.85"/>
    <rect class="bar9" x="72" width="4" rx="2" fill="#f43f5e" fill-opacity="0.85"/>
    <rect class="bar10" x="81" width="4" rx="2" fill="#e11d48" fill-opacity="0.85"/>
    <rect class="bar11" x="90" width="4" rx="2" fill="#c084fc" fill-opacity="0.85"/>
    <rect class="bar12" x="99" width="4" rx="2" fill="#38bdf8" fill-opacity="0.85"/>
  </g>
</svg>
