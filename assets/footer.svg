<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="90">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <style>
      @keyframes waveMotion {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseText {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .wave-path { animation: waveMotion 5s ease-in-out infinite; }
      .footer-txt { animation: pulseText 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="850" height="90" rx="12" fill="url(#footerBg)"/>

  <!-- Flowing Wave Graphic -->
  <path class="wave-path" d="M 0,45 Q 120,20 240,45 T 480,45 T 720,45 T 850,45 L 850,90 L 0,90 Z" fill="url(#footerWave)" fill-opacity="0.18"/>
  <path d="M 0,55 Q 140,35 280,55 T 560,55 T 850,55" fill="none" stroke="url(#footerWave)" stroke-width="2" stroke-opacity="0.65"/>

  <text class="footer-txt" x="425" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    ✦ CRAFTING MOTION &amp; VIBE CODING • ABU BAKR SIDDIQ ✦
  </text>
</svg>
